# /etc/nginx/sites-available/sga-demo  ->  ln -s en sites-enabled
# Dominio: sga.winsoft.es, apuntando a este servidor.
# TLS: certificado emitido con certbot --nginx -d sga.winsoft.es (bloques 443 y redirect ya incluidos abajo).
server {
    server_name sga.winsoft.es;
    client_max_body_size 25m;

    location / {
        proxy_pass         http://127.0.0.1:5120;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    listen 443 ssl; # managed by Certbot
    listen [::]:443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/sga.winsoft.es/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/sga.winsoft.es/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = sga.winsoft.es) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name sga.winsoft.es;
    return 404; # managed by Certbot
}
