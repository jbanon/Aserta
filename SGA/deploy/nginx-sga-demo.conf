# /etc/nginx/sites-available/sga-demo  ->  ln -s en sites-enabled
# Subdominio propuesto: sga-demo.winsoft.es (hay que crear el registro DNS apuntando a este servidor).
# TLS: sudo certbot --nginx -d sga-demo.winsoft.es
server {
    listen 80;
    server_name sga-demo.winsoft.es;
    client_max_body_size 25m;

    location / {
        proxy_pass         http://127.0.0.1:5120;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
