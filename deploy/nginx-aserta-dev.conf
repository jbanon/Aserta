# Proxy inverso de nginx para Aserta (desarrollo).
# Destino: /etc/nginx/sites-available/aserta-dev  +  ln -s en sites-enabled   (requiere sudo)
# Subdominio PENDIENTE de confirmar (DA-12). Tras el DNS:
#   sudo certbot --nginx -d aserta-dev.<dominio>
# Nota RD-08: X-Forwarded-For es la IP que queda en la auditoria (ForwardedHeaders en Program.cs).

server {
    server_name aserta-dev.CAMBIAR-DOMINIO;

    client_max_body_size 25m;   # subida de documentos desde el movil (fase 3)

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;

    location / {
        proxy_pass http://127.0.0.1:5110;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection keep-alive;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 80;
    listen [::]:80;
}
